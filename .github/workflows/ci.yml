name: Verificação e publicação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beautyflow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_CONVEX_URL: https://tame-salmon-877.convex.cloud
      - uses: actions/upload-artifact@v4
        with:
          name: beautyflow-pages
          path: dist
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Atualizar o único backend e compilar
        run: npx convex deploy --yes --cmd 'npm run build' --cmd-url-env-var VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Publicar no Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=beautyflow-os --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
